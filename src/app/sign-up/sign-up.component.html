      <!-- login.component.html -->
  <div class="d-flex justify-content-center align-items-center vh-100">
    
    <form class="form-group bg-white p-4 rounded shadow" style="width: 30rem;" [formGroup]="signUpForm" (ngSubmit)="signUp()">
        <p class="text-center fw-bold fs-3">Create your account</p>
        <label class="form-label">First Name: </label>
        <input class="form-control" type="text" formControlName="firstName" placeholder="Enter your first name" required>
        <div class="text-danger" *ngIf="signUpForm.get('firstName')?.invalid && signUpForm.get('firstName')?.touched">* required field.</div>

        <label class="form-label">Last Name: </label>
        <input class="form-control" type="text" formControlName="lastName" placeholder="Enter your last name">

        <label class="form-label">Email:</label>
        <input type="email" class="form-control" placeholder="xyz@gmail.com" formControlName="userName" required>
        <div class="text-danger" *ngIf="signUpForm.get('userName')?.invalid && signUpForm.get('userName')?.touched">
          <div *ngIf="signUpForm.get('userName')?.errors?.['required']">*required field.</div>
          <div *ngIf="signUpForm.get('userName')?.errors?.['email']">
            *Enter a valid email address
          </div>
         <div *ngIf="signUpForm.get('password')?.errors?.['minlength']">*password must be at least 5 and maximum 16 characters..</div>
        </div>
  
      <label class="form-label mt-3">Password:</label>
      <input type="password" class="form-control" placeholder="Enter a valid password" formControlName="password" required>
      <div class="text-danger" *ngIf="signUpForm.get('password')?.invalid && signUpForm.get('password')?.touched">
         <div *ngIf="signUpForm.get('password')?.errors?.['required']">*required field.</div>
         <div *ngIf="signUpForm.get('password')?.errors?.['minlength']">*password must be at least 5 and maximum 16 characters..</div>
      </div>
  
      <button type="submit" class="btn btn-primary mt-4 w-100" [disabled]="signUpForm.invalid">Log In</button>

      <div class="text-center mt-3">
        <span>Already have an account?</span>
        <a routerLink="/login" class="text-decoration-none text-primary"> Sign in </a>
     </div>
    </form>
  </div>
